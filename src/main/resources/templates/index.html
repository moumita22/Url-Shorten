<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>URL Shortener</title>
</head>
<body>
<h2>Shorten Your URL</h2>
<form th:action="@{/shorten}" method="post">
    <label>Enter Long URL:</label>
    <input type="text" name="longUrl" required/><br/><br/>
    
    <label>Custom Alias (optional):</label>
    <input type="text" name="customAlias"/><br/><br/>
    
    <label>Expiry (optional):</label>
    <input type="datetime-local" name="expiry"/><br/><br/>
    
    <button type="submit">Shorten</button>
</form>

<div th:if="${shortUrl}">
    <h3>Short URL:</h3>
    <a th:href="'/' + ${shortUrl}" th:text="${shortUrl}">shortUrl</a>
</div>
</body>
</html>
