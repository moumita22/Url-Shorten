<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>URL Shortener</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #374151;
        }

        input[type="text"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1em;
        }

        button {
            margin-top: 25px;
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2563eb;
        }

        .result {
            margin-top: 30px;
            text-align: center;
        }

        .result h3 {
            color: #16a34a;
        }

        .result a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            word-break: break-all;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🔗 Shorten Your URL</h2>
    <form th:action="@{/shorten}" method="post">
        <label>Enter Long URL:</label>
        <input type="text" name="longUrl" required/>

        <label>Custom Alias (optional):</label>
        <input type="text" name="customAlias"/>

        <label>Expiry Date & Time (optional):</label>
        <input type="datetime-local" name="expiry"/>

        <button type="submit">Shorten</button>
    </form>

    <div class="result" th:if="${shortUrl}">
        <h3>✅ Your Short URL:</h3>
        <a th:href="'/' + ${shortUrl}" th:text="@{'/' + ${shortUrl}}">shortUrl</a>
    </div>
</div>
</body>
</html>
